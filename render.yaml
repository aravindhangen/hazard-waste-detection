# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this GitHub repo in Render → New → Blueprint → select render.yaml
services:
  - type: web
    name: hazard-waste-detection
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: standard
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: HAZARD_DEVICE
        value: cpu
      - key: HAZARD_DEFAULT_MODEL_ID
        value: yolov8s
      - key: HAZARD_EAGER_LOAD
        value: "false"
      - key: HAZARD_BACKGROUND_WARMUP
        value: "true"
      - key: HAZARD_MAX_LOADED_MODELS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
      - key: PYTHONPATH
        value: /app
      - key: HAZARD_CONF_THRESHOLD
        value: "0.25"
