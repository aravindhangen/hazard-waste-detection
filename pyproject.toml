[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hazard-waste-detection"
version = "1.0.0"
description = "Hazardous waste instance segmentation for scrap-yard imagery"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
train = ["tqdm", "seaborn", "psutil", "thop", "albumentations", "pycocotools", "gitpython", "tensorboard"]
api = ["fastapi", "uvicorn", "python-multipart", "httpx"]
run2 = ["ultralytics>=8.3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hazard_detection*", "api*"]

[tool.setuptools]
py-modules = []
